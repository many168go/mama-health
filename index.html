<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="媽媽的照護助理">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D1F3C">
<link rel="manifest" id="pwa-manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>媽媽的照護助理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
      background:#0D1117;color:#E6EDF3;min-height:100vh}
header{position:sticky;top:0;z-index:100;background:#0D1F3C;
        padding:10px 14px;border-bottom:1px solid #21262D;
        display:flex;align-items:center;gap:12px}
.av-wrap{flex:none;cursor:pointer;position:relative}
.av-wrap:active{opacity:.75}
#av-ph{width:46px;height:46px;border-radius:50%;background:#1E3A5F;
        display:flex;align-items:center;justify-content:center;
        font-size:24px;border:2px solid #2563EB}
#av-img{display:none;width:46px;height:46px;border-radius:50%;
         object-fit:cover;border:2px solid #E11D48}
.av-badge{position:absolute;bottom:0;right:0;background:#2563EB;
           color:#fff;border-radius:50%;width:16px;height:16px;
           font-size:10px;display:flex;align-items:center;justify-content:center;
           border:1px solid #0D1F3C}
.hinfo{flex:1;min-width:0}
.htitle{font-size:16px;font-weight:700;color:#93C5FD;white-space:nowrap}
.hsub{font-size:10px;color:#FFD700;margin-bottom:1px}
.hmeta{margin-left:auto;font-size:11px;color:#7D8590;text-align:right;
        line-height:1.6;flex:none}.hmeta b{color:#22C55E}
.stats{background:#161B22;padding:10px 8px;display:flex;gap:8px;
        overflow-x:auto;border-bottom:1px solid #21262D;
        -webkit-overflow-scrolling:touch}
.si{flex:none;background:#0D1F3C;border-radius:10px;padding:8px 14px;
     text-align:center;min-width:72px}
.sico{font-size:18px;margin-bottom:2px}
.sv{font-size:18px;font-weight:700;color:#93C5FD;line-height:1}
.sl{font-size:10px;color:#7D8590;margin-top:2px}
.fbar{background:#161B22;padding:8px 12px;display:flex;gap:8px;
       overflow-x:auto;border-bottom:1px solid #21262D;
       -webkit-overflow-scrolling:touch;align-items:center}
.fb{flex:none;padding:5px 14px;border-radius:20px;border:1px solid #30363D;
     background:transparent;color:#7D8590;font-size:12px;cursor:pointer;
     font-family:inherit;white-space:nowrap}
.fb.on{background:#2563EB;color:#fff;border-color:#2563EB}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}
thead th{background:#1E3A5F;color:#94C6FF;padding:9px 10px;white-space:nowrap;
          position:sticky;top:0;z-index:10;border-bottom:2px solid #2563EB;
          text-align:center;font-size:11px}
td{padding:8px 10px;border-bottom:1px solid #21262D;white-space:nowrap;
    vertical-align:top;max-width:200px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:rgba(255,255,255,.04)}
tr.abn td{background:#1F0000;color:#FCA5A5}
tr.wrn td{background:#1C1000;color:#FCD34D}
tr.生理數值 td{background:#060D1A}
tr.飲食記錄 td{background:#050F05}
tr.用藥記錄 td{background:#0F0D00}
tr.每日摘要 td{background:#0F0820;color:#C4B5FD;font-weight:600}
.ec{color:#2D333B}
.fab{position:fixed;bottom:24px;right:20px;background:#2563EB;color:#fff;
      border:none;border-radius:50%;width:54px;height:54px;font-size:24px;
      cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.5);
      display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
        background:#1E3A5F;color:#E2E8F0;padding:12px 20px;border-radius:10px;
        font-size:13px;z-index:999;max-width:85vw;text-align:center;
        box-shadow:0 4px 16px rgba(0,0,0,.5);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<header>
  <div class="av-wrap" onclick="changeAvatar()" title="點擊更換媽媽的照片">
    <div id="av-ph">👵</div>
    <img id="av-img" src="" alt="avatar">
    <div class="av-badge">✎</div>
  </div>
  <div class="hinfo">
    <div class="hsub">🏥 媽媽的照護助理</div>
    <div class="htitle">健康紀錄總覽</div>
  </div>
  <div class="hmeta">更新<br>2026/05/16 01:55<br><b>0 筆</b></div>
</header>
<div class="stats"><div class="si"><div class="sico">🩸</div><div class="sv">-</div><div class="sl">收縮壓<br><span style="font-size:9px;opacity:.6">mmHg</span></div></div><div class="si"><div class="sico">💉</div><div class="sv">-</div><div class="sl">舒張壓<br><span style="font-size:9px;opacity:.6">mmHg</span></div></div><div class="si"><div class="sico">💓</div><div class="sv">-</div><div class="sl">脈搏<br><span style="font-size:9px;opacity:.6">bpm</span></div></div><div class="si"><div class="sico">🩺</div><div class="sv">-</div><div class="sl">血氧<br><span style="font-size:9px;opacity:.6">%</span></div></div><div class="si"><div class="sico">⚠️</div><div class="sv">0</div><div class="sl">異常次數<br><span style="font-size:9px;opacity:.6">次</span></div></div><div class="si"><div class="sico">⚡</div><div class="sv">0</div><div class="sl">警示次數<br><span style="font-size:9px;opacity:.6">次</span></div></div></div>
<div class="fbar">
  <button class="fb on" onclick="filt(this,'')">全部</button>
  <button class="fb" onclick="filt(this,'生理數值')">🩺 生理</button>
  <button class="fb" onclick="filt(this,'飲食記錄')">🍱 飲食</button>
  <button class="fb" onclick="filt(this,'用藥記錄')">💊 用藥</button>
  <button class="fb" onclick="filt(this,'abn')">🔴 異常</button>
  <button class="fb" onclick="filt(this,'wrn')">🟡 警示</button>
</div>
<div class="tw"><table id="tb">
<thead><tr><th>日期時間</th><th>類別</th><th>具體內容描述</th><th>收縮壓(高壓)</th><th>舒張壓(低壓)</th><th>脈搏壓(脈壓)</th><th>血氧飽和度(SpO2%)</th><th>脈搏速率(拍/分)</th><th>灌流指數PI(%)</th><th>飲食</th><th>頭暈分析</th><th>嘔吐分析</th><th>用藥紀錄</th></tr></thead>
<tbody></tbody>
</table></div>
<button class="fab" onclick="location.reload()" title="重新整理">↻</button>
<script>
// ── 篩選 ──────────────────────────────────────────────────
function filt(btn,cls){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('#tb tbody tr').forEach(r=>{
    r.style.display=(!cls||r.className.includes(cls))?'':'none';
  });
}
// ── 頭像 ──────────────────────────────────────────────────
const AV_KEY='mama_avatar_v1';
function loadAvatar(){
  const d=localStorage.getItem(AV_KEY);
  if(!d)return;
  document.getElementById('av-img').src=d;
  document.getElementById('av-img').style.display='block';
  document.getElementById('av-ph').style.display='none';
  applyDynManifest(d);
}
function changeAvatar(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const cv=document.createElement('canvas');
        cv.width=512;cv.height=512;
        const ctx=cv.getContext('2d');
        const s=Math.min(img.width,img.height);
        const sx=(img.width-s)/2,sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,512,512);
        const data=cv.toDataURL('image/png');
        localStorage.setItem(AV_KEY,data);
        document.getElementById('av-img').src=data;
        document.getElementById('av-img').style.display='block';
        document.getElementById('av-ph').style.display='none';
        applyDynManifest(data);
        toast('✅ 頭像已更新！\n若要更新主畫面圖示，請移除後重新「加入主畫面」');
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function applyDynManifest(iconDataUrl){
  const m={
    name:"媽媽的照護助理",short_name:"媽媽健康",
    start_url:"./",display:"standalone",
    background_color:"#0D1117",theme_color:"#0D1F3C",
    orientation:"portrait-primary",lang:"zh-TW",
    icons:[{src:iconDataUrl,sizes:"512x512",type:"image/png",purpose:"any maskable"}]
  };
  const blob=new Blob([JSON.stringify(m)],{type:'application/json'});
  document.getElementById('pwa-manifest').href=URL.createObjectURL(blob);
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),4000);
}
// ── Service Worker ─────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
loadAvatar();
</script>
</body></html>
